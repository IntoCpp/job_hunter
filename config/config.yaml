# Job-Hunter production configuration
# Copy and adjust paths for your environment.

posting_output: "C:/Users/ERIC/Documents/job_hunter_finds/"
posting_history: "C:/Users/ERIC/Documents/job_hunter_finds/posting_history.yaml"

search_profile:
  input_files:
    - "C:/Users/ERIC/Documents/Code/job-hunter-resume-rework/input_data/master_resume.md"
    - "C:/Users/ERIC/Documents/Code/job-hunter-resume-rework/input_data/master_resume_analysis_cache.json"
    - "C:/Users/ERIC/Documents/Code/job-hunter-resume-rework/input_data/summary.md"
  output_file: "C:/Users/ERIC/Documents/job_hunter_finds/job_search_profile.yaml"
  job_search_preferences:
    # Path relative to this config file (portable).
    file: "./my_job_preferences.yaml"

resume_rework:
  script_path: "C:/Users/ERIC/Documents/Code/job-hunter-resume-rework/resume_rework.py"
  working_directory: "C:/Users/ERIC/Documents/Code/job-hunter-resume-rework"

confidence_resume: 0.90

models:
 agent: "gpt-5.6-terra"       # Reserved for JobHunter Agent orchestration (future agent-driven workflow steps)
 profile: "gpt-5.6-sol"       # Analyzes resume input files and generates job_search_profile.yaml
 ranking: "gpt-5.6-sol"       # Scores each posting 0.00–1.00 for resume/job fit; use a capable model for accuracy
 location: "gpt-5.6-luna"     # Decides whether a posting location matches configured acceptable areas
 extraction: "gpt-5.6-luna"   # Extracts company, title, location, address, and description from posting pages


models_test: # Copy to use when testing
 agent: "gpt-5-mini"        # Reserved for JobHunter Agent orchestration (future agent-driven workflow steps)
 profile: "gpt-5"           # Analyzes resume input files and generates job_search_profile.yaml
 ranking: "gpt-5"           # Scores each posting 0.00–1.00 for resume/job fit; use a capable model for accuracy
 location: "gpt-5-mini"     # Decides whether a posting location matches configured acceptable areas
 extraction: "gpt-5-mini"   # Extracts company, title, location, address, and description from posting pages

models_prod: # Copy to use in production
 agent: "gpt-5.6-terra"       # Reserved for JobHunter Agent orchestration (future agent-driven workflow steps)
 profile: "gpt-5.6-sol"       # Analyzes resume input files and generates job_search_profile.yaml
 ranking: "gpt-5.6-sol"       # Scores each posting 0.00–1.00 for resume/job fit; use a capable model for accuracy
 location: "gpt-5.6-luna"     # Decides whether a posting location matches configured acceptable areas
 extraction: "gpt-5.6-luna"   # Extracts company, title, location, address, and description from posting pages

locations:
  - name: "Montreal Central and East"
    description: >
      Jobs located in downtown Montreal, central Montreal, east Montreal,
      and nearby areas that are generally convenient to reach from the South Shore.
      Exclude locations in the far west of Montreal unless explicitly specified
      elsewhere.

  - name: "South Shore of Montreal"
    description: >
      Longueuil, Brossard, Saint-Hubert, Boucherville, Saint-Bruno-de-Montarville,
      Sainte-Julie, and nearby municipalities.

  - name: "Selective North Shore"
    description: >
      Nearby North Shore locations that are easily accessible from the South Shore,
      such as Laval south-est or Terrebonne. Exclude distant North Shore locations such as Blainville
      and other areas requiring a long commute.

